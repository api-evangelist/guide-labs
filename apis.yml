aid: guide-labs
name: Guide Labs
description: >-
  Guide Labs is a product-focused AI research company building a new class of
  inherently interpretable AI systems and foundation models that humans and
  domain experts can reliably understand, steer, and debug. Its flagship
  platform, Clarity, is presented as the first inherently interpretable AI
  platform and surfaces the internal concepts driving a model's decisions, while
  its Steerling-8B is presented as the first inherently interpretable large
  language model. The team has published more than two dozen interpretability
  papers at top machine-learning venues and ships research artifacts such as
  PRISM training-data prototypes, the FineWeb Concept Atlas, and Atlas for
  orienting LLM pre-training data. Access to Clarity is available through
  platform.guidelabs.ai. The company is backed by Initialized Capital.
